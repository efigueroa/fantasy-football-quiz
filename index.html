<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fig Fam Draft Quiz</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#127944;</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 12px;
            line-height: 1.5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
            align-items: start;
            align-content: start;
            min-height: calc(100vh - 24px);
        }
        
        .header-section {
            grid-column: 1 / 8;
            grid-row: 1;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 20px;
            padding: 28px;
            position: relative;
            overflow: hidden;
        }
        
        .header-section::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.1) 0%, transparent 70%);
            transform: translate(50%, -50%);
        }
        
        .header h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        
        .stats-card {
            grid-column: 9 / 13;
            grid-row: 1;
            background: #22c55e;
            border-radius: 16px;
            padding: 24px;
            color: #ffffff;
        }
        
        .stats-card .label {
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .stats-card .value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            margin-top: 6px;
        }
        
        .question-card {
            grid-column: 1 / 10;
            grid-row: 2;
            background: #1e293b;
            border-radius: 20px;
            padding: 32px;
            border: 1px solid #334155;
            position: relative;
        }
        
        .question-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #22c55e);
            border-radius: 20px 20px 0 0;
        }
        
        .difficulty {
            display: inline-block;
            margin-left: 10px;
            padding: 3px 10px;
            border-radius: 50px;
            border: 1px solid currentColor;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        
        .difficulty.easy   { color: #22c55e; background: rgba(34, 197, 94, 0.12); }
        .difficulty.medium { color: #f59e0b; background: rgba(245, 158, 11, 0.12); }
        .difficulty.hard   { color: #ef4444; background: rgba(239, 68, 68, 0.12); }
        
        .question-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: #ffffff;
            line-height: 1.3;
            margin-bottom: 24px;
        }
        
        .answer-card {
            background: #065f46;
            border: 1px solid #10b981;
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
        }
        
        .answer-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #ffffff;
            line-height: 1.3;
        }
        
        .answer-text a {
            color: #ffffff;
            text-decoration: underline;
            text-decoration-color: rgba(255, 255, 255, 0.45);
            text-underline-offset: 3px;
        }
        
        .answer-text a:hover {
            text-decoration-color: #ffffff;
        }
        
        .answer-text a::after {
            content: ' \2197';
            font-size: 0.85em;
            opacity: 0.7;
            text-decoration: none;
        }
        
        .controls-section {
            grid-column: 10 / 13;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-self: end;
        }
        
        .btn {
            background: #ffffff;
            color: #1e293b;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            text-transform: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: #3b82f6;
            color: #ffffff;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn:disabled {
            background: #475569 !important;
            color: #94a3b8 !important;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }
        
        .navigation {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
        }
        
        .nav-btn {
            background: transparent;
            border: 2px solid #334155;
            color: #94a3b8;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .nav-btn:hover:not(:disabled) {
            border-color: #22c55e;
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .progress-bar {
            flex: 1;
            margin: 0 24px;
            height: 3px;
            background: #334155;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #22c55e);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        
        .timer {
            grid-column: 1 / -1;
            grid-row: 4;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
        }
        
        .timer > summary {
            padding: 12px 20px;
            cursor: pointer;
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            list-style: none;
        }
        
        .timer > summary::-webkit-details-marker {
            display: none;
        }
        
        .timer > summary::before {
            content: '\25B8  ';
        }
        
        .timer[open] > summary::before {
            content: '\25BE  ';
        }
        
        .timer > summary:hover {
            color: #22c55e;
        }
        
        .timer-body {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 20px 20px;
            flex-wrap: wrap;
        }
        
        .timer-display {
            font-size: 2.6rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            min-width: 4.5ch;
            font-variant-numeric: tabular-nums;
        }
        
        .timer-display.urgent {
            color: #ef4444;
        }
        
        .timer-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .timer-summary-time {
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }
        
        .loading {
            grid-column: 1 / -1;
            grid-row: 1 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            color: #94a3b8;
        }
        
        .error {
            grid-column: 1 / -1;
            grid-row: 2;
            background: #7f1d1d;
            border: 1px solid #dc2626;
            color: #fecaca;
            padding: 32px;
            border-radius: 16px;
            font-weight: 500;
        }
        
        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 0 16px;
            }
            
            .header-section {
                grid-column: 1;
                grid-row: 1;
                padding: 32px 24px;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
            
            .stats-card {
                grid-column: 1;
                grid-row: 2;
                padding: 24px;
            }
            
            .question-card {
                grid-column: 1;
                grid-row: 3;
                padding: 32px 24px;
            }
            
            .controls-section {
                grid-column: 1;
                grid-row: 4;
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .navigation {
                grid-row: 5;
                padding: 16px 0;
            }
            
            .timer {
                grid-row: 6;
            }
            
            .progress-bar {
                margin: 0 16px;
            }
        }
        
        @media (max-width: 640px) {
            body {
                padding: 16px;
            }
            
            .header-section {
                padding: 24px 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .question-card {
                padding: 24px 20px;
            }
            
            .question-text {
                font-size: 1.25rem;
            }
            
            .answer-card {
                padding: 24px 20px;
            }
            
            .answer-text {
                font-size: 1.125rem;
            }
            
            .controls-section {
                flex-direction: column;
                gap: 12px;
            }
            
            .btn {
                padding: 14px 20px;
            }
            
            .progress-bar {
                margin: 0 12px;
            }
        }
        
        /* Subtle animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header-section {
            animation: fadeInUp 0.6s ease;
        }
        
        .stats-card {
            animation: fadeInUp 0.6s ease 0.1s both;
        }
        
        .question-card {
            animation: fadeInUp 0.6s ease 0.2s both;
        }
        
        .controls-section {
            animation: fadeInUp 0.6s ease 0.3s both;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">
            Loading quiz...
        </div>
        
        <div id="quiz-content" style="display: none;">
            <div class="header-section">
                <div class="header">
                    <h1>🏈 Fig Fam Draft Quiz 🏈</h1>
                </div>
            </div>
            
            <div class="stats-card">
                <div class="value" id="chip-display" aria-live="polite">⚪⚪⚪⚪⚪</div>
            </div>
            
            <div class="question-card">
                <div style="text-align: center; margin-bottom: 20px;">
                    <span style="color: #94a3b8; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">
                        <span id="current-question-display">1</span> of <span id="total-questions">5</span>
                    </span>
                    <span class="difficulty easy" id="difficulty-badge">easy</span>
                </div>
                
                <div class="question-text" id="question-text" aria-live="polite">
                    Loading question...
                </div>
                
                <div class="answer-card" id="answer-card">
                    <div class="answer-text" id="answer-text">
                        Loading answer...
                    </div>
                </div>
            </div>
            
            <div class="controls-section">
                <button class="btn" id="correct-btn" onclick="mark(true)" style="background: #22c55e; color: white;">
                    ✓ Correct
                </button>
                <button class="btn" id="wrong-btn" onclick="mark(false)" style="background: #ef4444; color: white;">
                    ✗ Wrong  
                </button>
            </div>
            
            <div class="navigation">
                <button class="nav-btn" id="prev-btn" onclick="previousQuestion()">← Previous</button>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 20%"></div>
                </div>
                <button class="nav-btn" id="next-btn" onclick="nextQuestion()">Next →</button>
            </div>
            
            <details class="timer" id="timer-panel">
                <summary>Timer <span class="timer-summary-time" id="timer-summary"></span></summary>
                <div class="timer-body">
                    <div class="timer-display" id="timer-display">0:00</div>
                    <div class="timer-controls">
                        <button class="btn btn-primary" onclick="addMinute()">+1 min</button>
                        <button class="btn" id="timer-pause" onclick="toggleTimer()" disabled>Pause</button>
                        <button class="btn" id="timer-reset" onclick="resetTimer()" disabled>Reset</button>
                    </div>
                </div>
            </details>
        </div>
        
        <div id="final-results" style="display: none;">
            <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 35, 0.95); display: flex; align-items: center; justify-content: center; z-index: 1000;">
                <div style="background: #1e293b; border-radius: 20px; padding: 32px; border: 1px solid #334155; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); text-align: center; max-width: 500px; width: 90%;">
                    <h2 style="font-size: 2rem; margin-bottom: 16px; color: #ffffff;">Quiz Complete!</h2>
                    <div style="font-size: 1.2rem; color: #94a3b8; margin-bottom: 24px;">
                        You get <span id="final-chip-count" style="color: #22c55e; font-weight: 700;">0 chips</span>!
                    </div>
                    <div id="final-chip-display" style="font-size: 2.5rem;">⚪⚪⚪⚪⚪</div>
                    <button class="btn btn-primary" onclick="startGame()" style="margin-top: 28px;">
                        Play Again
                    </button>
                </div>
            </div>
        </div>
        
        <div id="error-message" class="error" style="display: none;"></div>
    </div>

    <script>
        // Each round ramps up: two easy, then two medium, then one hard
        const ROUND_PLAN = [['easy', 2], ['medium', 2], ['hard', 1]];
        const ROUNDS = ROUND_PLAN.reduce((n, [, count]) => n + count, 0);
        const SEEN_KEY = 'ffquiz-seen';

        let quizData = [];
        let gameQuestions = [];
        let currentQuestionIndex = 0;
        let questionAnswered = false;
        let advanceTimer = null;

        async function loadQuizData() {
            try {
                // Pages serves this with max-age=600, so a browser that cached the
                // old bank would hand it back for ten minutes while running new
                // page code against it. no-cache revalidates on the ETag instead:
                // a 304 when nothing changed, fresh data the moment it does.
                const response = await fetch('quiz-data.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                quizData = await response.json();

                if (!Array.isArray(quizData)) {
                    throw new Error('Quiz data is not an array');
                }
                for (const [difficulty, count] of ROUND_PLAN) {
                    const have = quizData.filter(q => q.difficulty === difficulty).length;
                    if (have < count) {
                        throw new Error(`Need ${count} ${difficulty} questions, found ${have}`);
                    }
                }

                document.getElementById('total-questions').textContent = ROUNDS;
                startGame();
            } catch (error) {
                console.error('Error loading quiz data:', error);
                showError(`Failed to load quiz data: ${error.message}. Make sure 'quiz-data.json' exists in the same directory.`);
            }
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'none';
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // -- seen-question history ------------------------------------------
        // ponytail: localStorage is per browser, so each phone keeps its own
        // history. Sharing it across drafters would need a server. Not worth it
        // for one night a year.
        function loadSeen() {
            try {
                return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)) || []);
            } catch (e) {
                return new Set();   // private mode, or someone hand-edited it
            }
        }

        function saveSeen(seen) {
            try {
                localStorage.setItem(SEEN_KEY, JSON.stringify([...seen]));
            } catch (e) {
                // Storage full or blocked. The game still plays, it just repeats.
            }
        }

        function pickQuestions() {
            const seen = loadSeen();
            const picked = [];

            for (const [difficulty, count] of ROUND_PLAN) {
                const all = quizData.filter(q => q.difficulty === difficulty);
                let pool = all.filter(q => !seen.has(q.question));
                if (pool.length < count) {
                    // This difficulty is used up. Rotate it on its own, so a
                    // short hard list does not keep resetting easy and medium.
                    all.forEach(q => seen.delete(q.question));
                    pool = all;
                }
                picked.push(...shuffleArray(pool).slice(0, count));
            }

            picked.forEach(q => seen.add(q.question));
            saveSeen(seen);

            // Copy, so userAnswer never sticks to the shared quizData objects
            return picked.map(q => ({ ...q }));
        }

        // -- game -----------------------------------------------------------

        function startGame() {
            clearTimeout(advanceTimer);
            gameQuestions = pickQuestions();
            currentQuestionIndex = 0;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('final-results').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'contents';
            displayQuestion();
        }

        function allAnswered() {
            return gameQuestions.every(q => q.userAnswer !== undefined);
        }

        // Next unanswered question after `from`, wrapping around. -1 if none
        // are left, which is what ends the round.
        function nextUnanswered(from) {
            for (let step = 1; step <= ROUNDS; step++) {
                const i = (from + step) % ROUNDS;
                if (gameQuestions[i].userAnswer === undefined) return i;
            }
            return -1;
        }

        function displayQuestion() {
            const question = gameQuestions[currentQuestionIndex];
            const onLastQuestion = currentQuestionIndex === ROUNDS - 1;

            document.getElementById('question-text').textContent = question.question;
            // Built as nodes rather than innerHTML so an answer containing
            // markup characters can never be parsed as HTML.
            const answerEl = document.getElementById('answer-text');
            answerEl.textContent = '';
            if (question.source) {
                const link = document.createElement('a');
                link.href = question.source;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = question.answer;
                answerEl.appendChild(link);
            } else {
                answerEl.textContent = question.answer;
            }
            document.getElementById('current-question-display').textContent = currentQuestionIndex + 1;

            const badge = document.getElementById('difficulty-badge');
            badge.textContent = question.difficulty;
            badge.className = 'difficulty ' + question.difficulty;

            // Re-scoring an answered question was how you farmed chips. Lock it.
            questionAnswered = question.userAnswer !== undefined;
            document.getElementById('correct-btn').disabled = questionAnswered;
            document.getElementById('wrong-btn').disabled = questionAnswered;

            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;

            // On the last question Next either ends the round or doubles back
            // to whatever was skipped, so it is never a dead end.
            const nextBtn = document.getElementById('next-btn');
            nextBtn.textContent = !onLastQuestion ? 'Next →'
                : allAnswered() ? 'Finish' : 'Skipped →';
            nextBtn.disabled = false;

            updateProgress();
            updateChipDisplay();
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / ROUNDS) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        // One chip per correct answer, nothing to start
        function chipCount() {
            return gameQuestions.filter(q => q.userAnswer === true).length;
        }

        function chipString() {
            return gameQuestions
                .map(q => q.userAnswer === true ? '⭐' : q.userAnswer === false ? '❌' : '⚪')
                .join('');
        }

        function updateChipDisplay() {
            document.getElementById('chip-display').textContent = chipString();
        }

        function mark(correct) {
            if (questionAnswered) return;
            gameQuestions[currentQuestionIndex].userAnswer = correct;
            questionAnswered = true;
            document.getElementById('correct-btn').disabled = true;
            document.getElementById('wrong-btn').disabled = true;
            updateChipDisplay();

            advanceTimer = setTimeout(nextQuestion, 1500);
        }

        function showFinalResults() {
            const total = chipCount();
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('final-results').style.display = 'block';
            document.getElementById('final-chip-count').textContent =
                `${total} chip${total === 1 ? '' : 's'}`;
            document.getElementById('final-chip-display').textContent = chipString();
        }

        function nextQuestion() {
            clearTimeout(advanceTimer);
            if (currentQuestionIndex < ROUNDS - 1) {
                currentQuestionIndex++;
            } else {
                const skipped = nextUnanswered(currentQuestionIndex);
                if (skipped === -1) {
                    showFinalResults();
                    return;
                }
                currentQuestionIndex = skipped;
            }
            displayQuestion();
        }

        function previousQuestion() {
            clearTimeout(advanceTimer);
            if (currentQuestionIndex === 0) return;
            currentQuestionIndex--;
            displayQuestion();
        }

        // -- draft clock ----------------------------------------------------
        // Counts down to a deadline rather than decrementing a counter, so a
        // backgrounded tab that stops firing timers does not lose the time.
        let timerEnd = 0;          // epoch ms it reaches zero, while running
        let timerLeft = 0;         // seconds banked, while paused or stopped
        let timerRunning = false;
        let timerHandle = null;
        let timerLastSecond = null;
        let audioCtx = null;

        function timerSeconds() {
            return timerRunning ? Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000)) : timerLeft;
        }

        function formatTime(total) {
            return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
        }

        // Synthesised rather than loaded, so the page carries no audio files
        // and the sounds still work with no network.
        function tone(freq, ms, type, gain) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const vol = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                vol.gain.setValueAtTime(gain, audioCtx.currentTime);
                vol.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + ms / 1000);
                osc.connect(vol).connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + ms / 1000);
            } catch (e) {
                // No Web Audio, or the browser refused to start it. The clock
                // still runs, it just runs quietly.
            }
        }

        function renderTimer() {
            const secs = timerSeconds();
            const display = document.getElementById('timer-display');
            display.textContent = formatTime(secs);
            display.className = 'timer-display' + (secs > 0 && secs <= 30 ? ' urgent' : '');

            // The summary stays visible when the panel is shut, so a collapsed
            // timer still shows the clock.
            document.getElementById('timer-summary').textContent =
                secs === 0 ? '' : formatTime(secs) + (timerRunning ? '' : ' paused');

            const pause = document.getElementById('timer-pause');
            pause.textContent = timerRunning ? 'Pause' : 'Resume';
            pause.disabled = secs === 0;
            document.getElementById('timer-reset').disabled = secs === 0;
        }

        function stopTimerLoop() {
            clearInterval(timerHandle);
            timerHandle = null;
        }

        function timerLoop() {
            const secs = timerSeconds();

            if (secs !== timerLastSecond) {
                // Tick and tock through the last 30 seconds, alternating pitch
                if (secs > 0 && secs <= 30) tone(secs % 2 ? 1150 : 850, 55, 'square', 0.09);
                timerLastSecond = secs;
            }

            if (secs === 0 && timerRunning) {
                timerRunning = false;
                timerLeft = 0;
                stopTimerLoop();
                tone(180, 900, 'sawtooth', 0.22);
                setTimeout(() => tone(140, 1100, 'sawtooth', 0.22), 450);
            }

            renderTimer();
        }

        function startTimerLoop() {
            if (timerHandle === null) timerHandle = setInterval(timerLoop, 200);
        }

        function addMinute() {
            if (timerRunning) {
                timerEnd += 60000;
            } else {
                timerLeft += 60;
                timerEnd = Date.now() + timerLeft * 1000;
                timerRunning = true;
            }
            timerLastSecond = null;
            // Open the panel, so Pause is one click away the moment time is on
            document.getElementById('timer-panel').open = true;
            startTimerLoop();
            renderTimer();
        }

        function toggleTimer() {
            if (timerRunning) {
                timerLeft = timerSeconds();
                timerRunning = false;
                stopTimerLoop();
            } else {
                if (timerLeft === 0) return;
                timerEnd = Date.now() + timerLeft * 1000;
                timerRunning = true;
                timerLastSecond = null;
                startTimerLoop();
            }
            renderTimer();
        }

        function resetTimer() {
            timerRunning = false;
            timerLeft = 0;
            timerEnd = 0;
            timerLastSecond = null;
            stopTimerLoop();
            renderTimer();
        }

        // Keyboard: arrows navigate, 1 marks correct, 2 marks wrong
        document.addEventListener('keydown', function(event) {
            switch (event.key) {
                case 'ArrowLeft':
                    previousQuestion();
                    break;
                case 'ArrowRight':
                    nextQuestion();
                    break;
                case '1':
                    mark(true);
                    break;
                case '2':
                    mark(false);
                    break;
            }
        });

        window.addEventListener('load', loadQuizData);
    </script>
</body>
</html>
